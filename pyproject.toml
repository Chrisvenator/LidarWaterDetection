[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidar-water-detection"
version = "0.1.0"
description = "Water vs. land classifier for full-waveform bathymetric LiDAR point clouds"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chrisvenator" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "shapely>=2.0",
    "xgboost>=2.0",
    "laspy[lazrs]>=2.5",
    "pyproj>=3.5",
    "matplotlib>=3.7",  # contour extraction for the boundary stage, not just plotting
    "pyarrow>=14.0",    # parquet I/O for the features disk cache
]

[project.optional-dependencies]
deep = ["torch>=2.0"]
train = ["torch>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "torch>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/lidarwater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: slow parity tests against real Pielach data (requires data/ + models/)",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # scipy/sklearn/xgboost/laspy/shapely ship no stubs
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# nets.py assigns nn = torch.nn after a guarded dynamic import (torch is an
# optional extra) — mypy can't resolve nn.Module as a base class there.
module = "lidarwater._models.nets"
disable_error_code = ["name-defined", "misc"]
